name: Build Speed Escape 3D APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Hybrid Web Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p app/src/main/assets/web
          cp -r dist/index.html app/src/main/assets/web/
          cp -r dist/assets app/src/main/assets/web/
          rm -rf app/src/main/assets/web/testing

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK & Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Gradle Dependency Resolution
        run: ./gradlew dependencies --configuration debugRuntimeClasspath || ./gradlew buildEnvironment

      - name: Clean Gradle Build
        run: ./gradlew clean --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Target APK $APK_FILE was not generated!"
            exit 1
          fi
          echo "Generated APK: $APK_FILE"
          echo "APK Size: $(du -h "$APK_FILE" | cut -f1)"
          mkdir -p testing
          cp "$APK_FILE" testing/app-debug.apk
          cp "$APK_FILE" testing/SpeedEscape3D-v1.1-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedEscape3D-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostic Logs on Build Failure
        if: failure()
        run: |
          echo "=== Android Build Failure Diagnostics ==="
          if [ -d "app/build/reports" ]; then
            echo "--- Test Reports ---"
            find app/build/reports -type f -name "*.txt" -exec cat {} + || true
          fi
          echo "--- Environment Info ---"
          java -version || true
          node -v || true
          echo "ANDROID_HOME: $ANDROID_HOME"
